<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 1000"
     role="img"
     aria-labelledby="titulo descricao">

  <title id="titulo">Brotim</title>

  <desc id="descricao">
    Mascote vegetal editável em SVG.
  </desc>


  <defs>

    <filter id="sombraSuave" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>

      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>

      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <filter id="sombraLeve" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4"/>

      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>

      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <linearGradient id="brilhoCorpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".52"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".16"/>
    </linearGradient>


    <linearGradient id="brilhoBarriga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#d6b885" stop-opacity=".28"/>
    </linearGradient>


    <radialGradient id="irisVerde" cx=".45" cy=".25" r=".75">
      <stop offset="0" stop-color="#95ff45"/>
      <stop offset=".48" stop-color="#4fc83d"/>
      <stop offset=".78" stop-color="#14793a"/>
      <stop offset="1" stop-color="#0b3527"/>
    </radialGradient>


    <linearGradient id="bocaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b80d2d"/>
      <stop offset="1" stop-color="#5f0718"/>
    </linearGradient>


    <linearGradient id="linguaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8b93"/>
      <stop offset="1" stop-color="#ff5e73"/>
    </linearGradient>

  </defs>


