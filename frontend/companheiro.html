<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crie seu companheiro | EcoEnergia</title>

    <link rel="stylesheet" href="companheiro.css">
</head>

<body class="pagina-companheiro">

    <main class="criacao-companheiro">

        <header class="companheiro-topo">

            <span class="companheiro-etapa" id="companheiro-etapa">
                Etapa 1 de 7
            </span>

            <h1 id="companheiro-titulo">
                Escolha seu companheiro
            </h1>

            <p id="companheiro-descricao">
                Ele vai acompanhar você durante toda a sua jornada!
            </p>

        </header>


        <section class="companheiro-conteudo">

            <!-- ========================= -->
            <!-- PREVIEW -->
            <!-- ========================= -->

            <div class="companheiro-preview">

                <div id="preview-companheiro" class="preview-personagem">
                    🌱
                </div>

                <p id="preview-nome">
                    Escolha uma espécie
                </p>

            </div>


            <!-- ========================= -->
            <!-- ESCOLHA DA ESPÉCIE -->
            <!-- ========================= -->

            <div class="companheiro-opcoes">

                <button type="button" class="opcao-especie" data-especie="brotim">
                    <span class="especie-icone">
                        🌱
                    </span>

                    <strong>
                        Brotim
                    </strong>

                    <small>
                        Amigo da natureza
                    </small>
                </button>


                <button type="button" class="opcao-especie" data-especie="gotim">
                    <span class="especie-icone">
                        💧
                    </span>

                    <strong>
                        Gotim
                    </strong>

                    <small>
                        Amigo das águas
                    </small>
                </button>


                <button type="button" class="opcao-especie" data-especie="faisquinha">
                    <span class="especie-icone">
                        ⚡
                    </span>

                    <strong>
                        Faisquinha
                    </strong>

                    <small>
                        Cheio de energia
                    </small>
                </button>

            </div>

        </section>


        <footer class="companheiro-acoes">

            <button type="button" id="btn-selecionar-especie" disabled>
                Selecionar
            </button>

        </footer>

    </main>


    <script src="companheiro.js"></script>

</body>

</html>
